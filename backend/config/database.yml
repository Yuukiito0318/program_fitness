# PostgreSQL connection settings.
#
# Never write real hosts, passwords, or connection URLs in this file.
# Set them as environment variables instead (see backend/.env.example).
# In development and test, backend/.env is loaded automatically by the dotenv gem.
#
# If DATABASE_URL is set, Rails merges it on top of the values below,
# so a single DATABASE_URL is enough to switch to Supabase.
default: &default
  adapter: postgresql
  encoding: unicode
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # Windows has no Unix domain sockets, so always connect over TCP.
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "program_fitness_development" } %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("DB_TEST_NAME") { "program_fitness_test" } %>

# The hosting provider is not decided yet.
# Configure production entirely through the DATABASE_URL environment variable.
production:
  <<: *default
